name: CI Dev

on:
  pull_request:
    branches: ["dev"]
  push:
    branches: ["*"]

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/visiobook-esp/support-storage-service
  DOCKERFILE_PROD: docker/Dockerfile.prod

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort
      - name: Black formatting check
        run: black --check src tests
      - name: isort import order check
        run: isort --check-only src tests

  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint
      - name: Pylint
        run: pylint src tests

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install mypy
      - name: Mypy type check
        run: mypy src tests

  no-debug-leftovers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if Python debug statements exist outside tests/
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E '(pdb\.set_trace\(|(^|[^[:alnum:]_])print\(|breakpoint\()' -- \
              '*.py' ':(exclude)tests/**'; then
            echo "::error:: Python debug statements found outside tests/." >&2
            exit 1
          fi
          echo "----- No debug leftovers outside tests/"

  docker-compose-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
      - name: Create minimal .env
        run: |
          cat > .env << 'EOF'
          PYTHONPATH=/app
          PYTHONUNBUFFERED=1
          APP_ENV=test
          EOF
      - name: Build test services
        run: docker compose -f docker-compose-prod.yml up --build -d
      - name: Wait for PostgreSQL
        run: |
          timeout 60s bash -c 'until docker compose exec postgres pg_isready -U test_user -d test_db; do sleep 2; done'
      - name: Run tests inside container
        run: docker compose exec -T user-service pytest --cov=src --cov-report=term-missing --cov-fail-under=0

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs:
      - format-check
      - lint-check
      - type-check
      - no-debug-leftovers
      - docker-compose-and-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PROD }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
